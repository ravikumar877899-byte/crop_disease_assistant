<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Crop Care</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --bg-neutral: #f1f8e9;
            --text-dark: #1b5e20;
            --text-light: #558b2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-neutral);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #e8f5e9, #f1f8e9, #e0f2f1, #f4f9f4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-screen {
            width: 100%;
            max-width: 380px;
            background: var(--light-green);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .branding {
            font-size: 20px;
            color: var(--primary-green);
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .tab-container {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .tab-container span {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            padding-bottom: 5px;
        }

        .tab-underline {
            height: 3px;
            width: 40px;
            background: var(--primary-green);
            margin: 5px auto 0;
            border-radius: 2px;
        }

        .form-container {
            padding: 10px 35px 20px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .input-group:focus-within {
            background: #fff;
            box-shadow: 0 0 0 2px var(--primary-green);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: var(--primary-green);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-box.gray, .icon-box.light-gray { background: var(--primary-green); color: #fff; }

        .input-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 15px;
            font-size: 15px;
            outline: none;
            color: var(--text-dark);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .submit-btn:hover { background: #1b5e20; transform: translateY(-1px); }

        .links-container {
            text-align: center;
            padding: 15px 0 25px;
            font-size: 13px;
            color: var(--text-light);
            z-index: 10;
        }

        .links-container a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .wheat-visual { display: none; }

        .social-footer {
            margin-top: 30px;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social-icon {
            width: 35px;
            height: 35px;
            background: #000;
            color: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.3s;
        }

        .social-icon:hover { transform: translateY(-5px); }

        .footer-text { color: white; font-weight: 600; font-size: 16px; opacity: 0.9; }

        #msg {
            margin: 0 35px 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .msg-error { background: #ffebee; color: #c62828; display: block; }
        .msg-success { background: #e8f5e9; color: #2e7d32; display: block; }

    </style>
</head>
<body class="animated-bg">

    <div class="signup-screen">
        <div class="header">
            <h1>JOIN US !</h1>
            <p>Create Your Account</p>
            <div class="tab-container">
                <span>REGISTER</span>
                <div class="tab-underline"></div>
            </div>
            <div class="branding">
                <i class="fas fa-leaf"></i> AI Crop Care <span style="font-size: 14px; font-weight: 400; opacity: 0.7; margin-left: 5px;">(eg. Smart Agriculture)</span>
            </div>
        </div>

        <div id="msg"></div>

        <form class="form-container" id="signupForm">
            <div class="input-group">
                <div class="icon-box">
                    <i class="fas fa-id-card"></i>
                </div>
                <input type="text" name="name" placeholder="Full Name (eg. John Doe)" required>
            </div>

            <div class="input-group">
                <div class="icon-box gray">
                    <i class="fas fa-envelope"></i>
                </div>
                <input type="text" name="email" placeholder="Username or Email (eg. name@mail.com)" required>
            </div>

            <div class="input-group">
                <div class="icon-box light-gray">
                    <i class="fas fa-lock"></i>
                </div>
                <input type="password" name="password" placeholder="Password (eg. pass123)" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">REGISTER</button>
        </form>

        <div class="links-container">
        </div>


    </div>

    <div class="social-footer">
        <div class="social-icons">
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        </div>
        <p class="footer-text">Follow Us On Social Media</p>
    </div>

    <script>
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msgDiv = document.getElementById('msg');
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            const formData = new FormData(e.target);
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'msg-success';
                    msgDiv.innerText = data.success;
                    msgDiv.style.display = 'block';
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    msgDiv.className = 'msg-error';
                    msgDiv.innerText = data.error;
                    msgDiv.style.display = 'block';
                    btn.innerHTML = 'REGISTER';
                    btn.disabled = false;
                }
            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'Connection error. Please try again.';
                msgDiv.style.display = 'block';
                btn.innerHTML = 'REGISTER';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
