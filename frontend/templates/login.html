<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Crop Care</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #ff9800;
            --dark-orange: #f57c00;
            --bg-gradient: #f8f9fa;
            --text-dark: #333;
            --text-light: #777;
        }

        /* Existing specific login styles... */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrolling for split layout */
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #e8f5e9, #f1f8e9, #e0f2f1, #f4f9f4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-screen {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .tab-container {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .tab-container span {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            padding-bottom: 5px;
        }

        .tab-underline {
            height: 3px;
            width: 40px;
            background: var(--primary-orange);
            margin: 5px auto 0;
            border-radius: 2px;
        }

        .form-container {
            padding: 20px 35px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .input-group:focus-within {
            background: #fff;
            box-shadow: 0 0 0 2px var(--primary-orange);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: #444;
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-box.gray {
            background: #ccc;
            color: #fff;
        }

        .input-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 15px;
            font-size: 15px;
            outline: none;
            color: var(--text-dark);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .submit-btn:hover {
            background: var(--dark-orange);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .links-container {
            text-align: center;
            padding: 20px 0;
            font-size: 13px;
            color: var(--text-light);
            z-index: 10;
        }

        .links-container a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .wheat-visual { display: none; }

        .social-footer {
            margin-top: 30px;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social-icon {
            width: 35px;
            height: 35px;
            background: #000;
            color: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.3s;
        }

        .social-icon:hover {
            transform: translateY(-5px);
        }

        .footer-text {
            color: white;
            font-weight: 600;
            font-size: 16px;
            opacity: 0.9;
        }

        #msg {
            margin: 0 35px 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .msg-error { background: #ffebee; color: #c62828; display: block; }
        .msg-success { background: #e8f5e9; color: #2e7d32; display: block; }

    </style>
</head>
<body>

    <div class="login-screen">
        <div class="header">
            <h1>WELCOME !</h1>
            <p>Please Log In To Continue</p>
            <div class="tab-container">
                <span>LOGIN</span>
                <div class="tab-underline"></div>
            </div>
        </div>

        <div id="msg"></div>

        <form class="form-container" id="loginForm">
            <div class="input-group">
                <div class="icon-box">
                    <i class="fas fa-user"></i>
                </div>
                <input type="text" name="email" placeholder="Username or Email" required>
            </div>

            <div class="input-group">
                <div class="icon-box gray">
                    <i class="fas fa-lock"></i>
                </div>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">SUBMIT</button>
        </form>

        <div class="links-container">
            <p>Forgot Your Password? <a href="#">Reset Here</a></p>
            <p style="margin-top: 5px;">Don't Have An Account? <a href="/register">Register</a></p>
        </div>


    </div>

    <div class="social-footer">
        <div class="social-icons">
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-behance"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-vimeo-v"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-medium-m"></i></a>
        </div>
        <p class="footer-text">Follow Me On Social : Niteen4u</p>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msgDiv = document.getElementById('msg');
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            const formData = new FormData(e.target);
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'msg-success';
                    msgDiv.innerText = data.success;
                    msgDiv.style.display = 'block';
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    msgDiv.className = 'msg-error';
                    msgDiv.innerText = data.error;
                    msgDiv.style.display = 'block';
                    btn.innerHTML = 'SUBMIT';
                    btn.disabled = false;
                }
            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'Connection error. Please try again.';
                msgDiv.style.display = 'block';
                btn.innerHTML = 'SUBMIT';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
